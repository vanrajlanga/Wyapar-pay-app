<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Broadband/WiFi Icon with Gradient Background -->
  <defs>
    <linearGradient id="broadbandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="120" height="120" rx="12" fill="url(#broadbandGradient)"/>
  
  <!-- WiFi Symbol -->
  <path d="M60 70 L60 70" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M45 55 Q 60 45, 75 55" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M35 45 Q 60 30, 85 45" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M25 35 Q 60 15, 95 35" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="60" cy="65" r="4" fill="white"/>
  
  <!-- Recharge Symbol -->
  <circle cx="85" cy="75" r="10" fill="#4CAF50" stroke="white" stroke-width="2"/>
  <path d="M85 70 L85 75 L90 75 M85 75 L85 80 L80 80" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">BROADBAND</text>
</svg>

