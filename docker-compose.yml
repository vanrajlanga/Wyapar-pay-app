version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: wyapar-pay-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wyapar_pay
      MYSQL_USER: wyapar_user
      MYSQL_PASSWORD: wyapar_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - wyapar-network

  # Redis Cache (Optional - Comment out to disable for cost savings)
  # redis:
  #   image: redis:7-alpine
  #   container_name: wyapar-pay-redis
  #   restart: always
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - wyapar-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wyapar-pay-backend
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: wyapar_user
      DB_PASSWORD: wyapar_password
      DB_DATABASE: wyapar_pay
      REDIS_ENABLED: false
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-this-in-production
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - wyapar-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: wyapar-pay-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infra/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - wyapar-network

volumes:
  mysql_data:
  redis_data:

networks:
  wyapar-network:
    driver: bridge
